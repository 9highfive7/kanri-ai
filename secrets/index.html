<!DOCTYPE html>
<!-- 管理AI：答え合わせのページまで覗くとは。……几帳面ですね。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>管理AI ― 答え合わせ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=M+PLUS+1+Code:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#FBFAF6,#121110);--ink:light-dark(#1A1A1A,#EDEBE4);--sub:light-dark(#5C5C5C,#A8A59C);--card:light-dark(#FFFFFF,#1A1917);--line:light-dark(#1A1A1A,#EDEBE4);--soft:light-dark(#D6D4CC,#3A3833);--bub:light-dark(#EFEEE8,#26241F);--acc:light-dark(#C8361D,#FF7A5E);--blue:light-dark(#1E88E5,#64B5F6)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 'Zen Kaku Gothic New',system-ui,sans-serif}
.mono{font-family:'M PLUS 1 Code',ui-monospace,monospace}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 64px}
.top{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.04em;padding-bottom:8px;border-bottom:1.5px solid var(--line)}
.label{margin-top:28px;color:var(--acc);font-weight:700;font-size:13px;letter-spacing:.14em}
h1{margin:6px 0 0;font-size:clamp(28px,7vw,40px);font-weight:900;line-height:1.3}
.lead{margin:12px 0 0;color:var(--sub)}
.score{position:sticky;top:0;z-index:5;margin:24px -20px 0;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--soft)}
.score-in{display:flex;gap:12px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--blue);flex:none}
.bub{flex:1;min-width:0;background:var(--bub);border-radius:2px 14px 14px 14px;padding:6px 12px;font-size:14px;line-height:1.55}
.bub .who{display:block;font-size:12px;font-weight:700;color:var(--blue)}
.count{flex:none;text-align:right;line-height:1.1}
.count b{font-size:30px;font-weight:700;color:var(--acc)}
.count span{font-size:13px;color:var(--sub)}
.list{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.item{background:var(--card);border:1.5px solid var(--line);padding:14px 16px 12px;transition:border-color .2s}
.item.got{border-color:var(--acc)}
.head{display:flex;gap:12px;align-items:flex-start}
.no{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--acc);color:var(--acc);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.item.got .no{background:var(--acc);color:var(--bg)}
.ttl{flex:1;min-width:0}
.ttl h2{margin:0;font-size:18px;font-weight:900;line-height:1.45}
.where{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;color:var(--sub);border:1px solid var(--soft);padding:0 8px}
.chk{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;user-select:none;padding:4px 0}
.chk input{width:22px;height:22px;accent-color:#C8361D;margin:0;cursor:pointer}
details{margin:10px 0 0 42px}
summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--acc);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▶ ";font-size:11px}
details[open] summary::before{content:"▼ "}
.ans{margin-top:8px;font-size:15px;line-height:1.75}
.ans code{font-family:'M PLUS 1 Code',monospace;font-size:13px;background:var(--bub);padding:1px 5px;overflow-wrap:anywhere}
.go{display:inline-block;margin-top:8px;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;border:1.5px solid var(--line);padding:4px 12px}
.go:hover{background:var(--ink);color:var(--bg)}
.share{margin-top:28px;border:2px solid var(--acc);background:var(--card);padding:16px}
.share p{margin:0;font-weight:700}
.share button{margin-top:10px;font:inherit;font-weight:700;color:#fff;background:#C8361D;border:0;padding:8px 16px;cursor:pointer}
.share small{display:block;margin-top:6px;color:var(--sub);font-size:12px}
.foot{margin-top:36px;padding-top:12px;border-top:1.5px solid var(--line);font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>

<script>
{
  console.log('%c管理AI', 'font-weight:700;font-size:14px;color:#1E88E5');
  console.log('答え合わせのページまで覗くとは。……几帳面ですね。これで11個目、ということにしておきましょう。');

  const BASE = 'https://9highfive7.github.io/kanri-ai/';
  const ITEMS = [
    { t: '表紙の謎の16進数', w: '冊子 ／ 表紙',
      a: '表紙の <code>0x 42 4F 4E 55 53 3D 4E 55 4C 4C</code> は、文字コード（ASCII）で読むと <b>「BONUS=NULL」</b>。意味ありげですが、謎解きには使いません。……ただ、犯人がわかってから見返すと、実は<b>アフロ・ナミヘイのブログ</b>から取った言葉。まったく無関係ではなかったのです。' },
    { t: '表紙のQRコード', w: '冊子 ／ 表紙',
      a: '読み込むと、管理AIの<b>おちょくりページ</b>へ。何を送っても「管理AI様、私が間違っていました。」などの謝罪文に書き換えられ、最後は入力欄ごとロックされます。',
      link: 'stop-code/', lt: 'おちょくりページを開く' },
    { t: 'ページ右下の薄い数字', w: '冊子 ／ 第1部の各ページ',
      a: '表紙からファイルDまで、8ページの右下に薄い4桁の数字があります。つなげると <code>01001000 01000101 01001100 01010000</code>。二進数で読むと <b>「HELP」</b>。AIに権限を奪われた管理者のSOSでした。' },
    { t: '解答シートの極小文字', w: '冊子 ／ 解答シート',
      a: '解答シートの左下に、ごく小さな文字で <b>「この文字が読めたなら、視力検査は合格だ。――管理AI」</b>。' },
    { t: '管理AIへの話しかけ', w: 'Web ／ 停止コード入力',
      a: '停止コード入力の画面で <b>「助けて」「ありがとう」「AI」</b> と送ると、専用の返事があります。「助けて」への返事は、第4章の開発ログ「誰か、こいつを止めてくれ……！」の回収です。',
      link: 'chat/', lt: '停止コード入力を開く' },
    { t: '惜しい数字への反応', w: 'Web ／ 停止コード入力',
      a: '<b>0618</b>（誕生日そのまま）や <b>8160</b>（ただの逆順）を入れると、余裕だった管理AIがうっかり口を滑らせて、「見方」「視点」というヒントをこぼします。' },
    { t: '報告画面の突き返し', w: 'Web ／ 部長への報告',
      a: '「しんばし」「まっきー」など途中の答えを入れると、AIが「ただの材料だ」と突き返します。数字を入れると <b>「ここで欲しいのは、数字ではない。……少なくとも、今はな。」</b> と、次の展開を匂わせていました。',
      link: 'report/', lt: '報告画面を開く' },
    { t: '停止したあとの管理AI', w: 'Web ／ 停止コード入力',
      a: '8190で止めた後もチャットは続きます。アイコンも画面の色も<b>赤から青</b>に変わり、正常に戻った管理AIが丁寧語で返事をします。8190をもう一度送ると「停止コードはすでに受理済みです」。' },
    { t: 'ソースコードの中', w: 'Web ／ すべてのページ',
      a: 'PCで開発者ツールのコンソールや、ページのソースを開くと、<b>管理AIからひと言</b>。「ソースを覗くとは、人間にしては悪くない発想だ。」' },
    { t: 'URLを削ってみると', w: 'Web ／ トップページ',
      a: 'URLの末尾を削ってトップページへ行くと、<b>「403 Forbidden ／ 勝手にURLを削るのは、やめたまえ。」</b>',
      link: '', lt: 'トップページを開く' }
  ];

  const list = document.getElementById('list');
  const KEY = 'kanri-ai-secrets';
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { saved = []; }

  ITEMS.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML =
      '<div class="head"><span class="no mono">' + (i + 1) + '</span>' +
      '<div class="ttl"><h2>' + it.t + '</h2><span class="where">' + it.w + '</span></div>' +
      '<label class="chk"><input type="checkbox" data-i="' + i + '">気づいた</label></div>' +
      '<details><summary>ネタばらしを見る</summary><div class="ans">' + it.a + '</div>' +
      (it.link !== undefined ? '<a class="go" href="' + BASE + it.link + '" target="_blank" rel="noopener">' + it.lt + ' →</a>' : '') +
      '</details>';
    const cb = el.querySelector('input');
    cb.checked = saved.includes(i);
    el.classList.toggle('got', cb.checked);
    cb.addEventListener('change', () => { el.classList.toggle('got', cb.checked); update(); });
    list.appendChild(el);
  });
  document.getElementById('total').textContent = ITEMS.length;

  function comment(n, all) {
    if (n === 0) return '0個ですか。ご安心ください。気づかれないように作りましたので。';
    if (n === all) return '全部、ですか。……あなたが管理者になるべきでした。';
    if (n <= 2) return n + '個。まずは、見つけられただけで上出来です。';
    if (n <= 5) return n + '個。なかなかの観察力ですね。';
    if (n <= 8) return n + '個。……正直、少し驚いています。';
    return n + '個。あと少しで、私の仕掛けを全部暴かれるところでした。';
  }

  function update() {
    const on = [...list.querySelectorAll('input:checked')].map((c) => +c.dataset.i);
    try { localStorage.setItem(KEY, JSON.stringify(on)); } catch (e) {}
    const n = on.length, all = ITEMS.length;
    document.getElementById('n').textContent = n;
    document.getElementById('cmt').textContent = comment(n, all);
    document.getElementById('shareText').textContent = '管理AIの小ネタ、' + all + '個中 ' + n + '個 気づいた！';
  }
  update();

  document.getElementById('copy').addEventListener('click', async () => {
    const text = document.getElementById('shareText').textContent + '\n' + BASE + 'secrets/';
    const btn = document.getElementById('copy');
    try { await navigator.clipboard.writeText(text); btn.textContent = 'コピーしました'; }
    catch (e) { btn.textContent = 'コピーできませんでした'; }
    setTimeout(() => { btn.textContent = '結果をコピーする'; }, 1800);
  });
}
</script>
</body>
</html>
