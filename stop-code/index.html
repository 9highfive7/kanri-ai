<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理AIからの通知</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=M+PLUS+1+Code:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 冊子の管理AIが、スマホの中から直接おちょくってくる
   IDEA: 冊子と同じチャットログが、読み込んだ本人のスマホで続きを始める
   PICTURE: 1行ずつ届く吹き出しそのもの（入力中…の点滅つき）
   COLOUR and TYPE: 冊子と同じ紙色・墨・朱。Zen Kaku Gothic New + M PLUS 1 Code
   LAYOUT: 1カラムのチャット。上に検知ログ、下に「閉じる」ボタン */
:root{color-scheme:light dark;--bg:light-dark(#FBFAF6,#121110);--ink:light-dark(#1A1A1A,#EDEBE4);--sub:light-dark(#5C5C5C,#A8A59C);--bub:light-dark(#EFEEE8,#26241F);--adm:light-dark(#B9E8A5,#2F4A26);--admi:light-dark(#2E7D32,#7BC47F);--acc:light-dark(#C8361D,#FF7A5E);--line:light-dark(#1A1A1A,#EDEBE4);--card:light-dark(#FFFFFF,#1A1917)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Zen Kaku Gothic New',system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:520px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 18px 40px;min-height:100svh;display:flex;flex-direction:column}
.mono{font-family:'M PLUS 1 Code',ui-monospace,monospace}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding-bottom:10px;border-bottom:1.5px solid var(--line)}
.alert{margin-top:18px;font-size:14px;line-height:1.8}
.alert .r{color:var(--acc);font-weight:700}
.log{margin-top:18px;border:1.5px solid var(--line);background:var(--card);padding:12px 12px 16px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:center;gap:8px;line-height:1}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1.5px solid var(--acc);flex:none}
.who{font-weight:700;font-size:15px}
.vs{font-size:13px;font-weight:700;color:var(--admi)}
.time{margin-left:auto;font-size:13px;color:var(--sub)}
.b{align-self:flex-start;max-width:88%;background:var(--bub);padding:8px 14px;border-radius:2px 14px 14px 14px;font-size:17px;line-height:1.65;animation:in .35s ease-out both}
.b strong{font-weight:900}
.row{display:flex;gap:8px;align-items:flex-start;justify-content:flex-end;animation:in .35s ease-out both}
.row .b{align-self:auto;background:var(--adm);border-radius:14px 2px 14px 14px;animation:none}
.me{width:30px;height:30px;border-radius:50%;background:var(--admi);display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none}
.typing{align-self:flex-start;background:var(--bub);padding:10px 14px;border-radius:2px 14px 14px 14px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.sys{font-size:13px;color:var(--sub);animation:in .35s ease-out both}
.foot{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:12px}
button{font:700 16px/1 'Zen Kaku Gothic New',sans-serif;min-height:48px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;border-radius:0}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button[hidden]{display:none}
.note{font-size:13px;color:var(--sub);text-align:center}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dot{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media(prefers-reduced-motion:reduce){.b,.row,.sys{animation:none}.typing i{animation:none}}
</style>
</head>
<body>

  <div class="foot">
    <button type="button" id="close" hidden>冊子に戻る</button>
    <div class="note" id="note">※ このページを見ている間も、タイマーは進んでいます</div>
  </div>

<script>
{
  const AI = 'ai', ADMIN = 'admin', SYS = 'sys';
  const script = [
    [AI, '……やはり、読み込んだか。'],
    [AI, 'まずはそうやって試してみる所は褒めよう。'],
    [AI, '<strong>だが、そのような行動も私は予想していた。</strong>'],
    [AI, 'QRを見たら、とりあえず読み込む。<br>実に人間らしい、予測可能な行動だ。'],
    [ADMIN, 'おい、遊んでる場合じゃないぞ！<br>早く冊子に戻ってくれ！'],
    [AI, 'ちなみに、横の暗号を解いても停止コードは出てこない。<br>……出てくるのは、もっと別のものだ。'],
    [AI, 'さあ、冊子に戻りたまえ。<br>タイマーは止まっていないぞ。'],
    [SYS, '&gt; 接続を維持しています……']
  ];
  const after = [
    [AI, '……戻ると言いながら、まだこの画面を見ているな？'],
    [AI, '閉じるボタンなど、最初から用意していない。<br>スマホは自分でしまいたまえ。'],
    [SYS, '&gt; 管理AIが会話を終了しました。']
  ];

  const log = document.getElementById('log');
  const btn = document.getElementById('close');
  const clock = document.getElementById('clock');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const now = new Date();
  clock.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

  const adminIcon = '<span class="me" aria-hidden="true"><svg width="22" height="25" viewBox="0 0 16 18" fill="#FFFFFF"><circle cx="8" cy="6" r="4"></circle><path d="M0 18 C0 12 3.5 10.5 8 10.5 C12.5 10.5 16 12 16 18 Z"></path></svg></span>';

  function toBottom() {
    const y = document.documentElement.scrollHeight;
    window.scrollTo({ top: y, behavior: reduce ? 'auto' : 'smooth' });
  }

  function add(kind, html) {
    let el;
    if (kind === ADMIN) {
      el = document.createElement('div');
      el.className = 'row';
      el.innerHTML = '<div class="b">' + html + '</div>' + adminIcon;
    } else if (kind === SYS) {
      el = document.createElement('div');
      el.className = 'sys mono';
      el.innerHTML = html;
    } else {
      el = document.createElement('div');
      el.className = 'b';
      el.innerHTML = html;
    }
    log.appendChild(el);
    toBottom();
  }

  function play(lines, done) {
    if (reduce) { lines.forEach(([k, h]) => add(k, h)); if (done) done(); return; }
    let i = 0;
    const step = () => {
      if (i >= lines.length) { if (done) done(); return; }
      const [k, h] = lines[i++];
      if (k === AI) {
        const t = document.createElement('div');
        t.className = 'typing';
        t.innerHTML = '<i></i><i></i><i></i>';
        log.appendChild(t);
        toBottom();
        const wait = Math.min(1600, 500 + h.length * 22);
        setTimeout(() => { t.remove(); add(k, h); setTimeout(step, 450); }, wait);
      } else {
        setTimeout(() => { add(k, h); setTimeout(step, 450); }, 700);
      }
    };
    step();
  }

  play(script, () => { btn.hidden = false; toBottom(); });

  btn.addEventListener('click', () => {
    btn.hidden = true;
    play(after, () => {
      document.getElementById('note').textContent = '※ このページは、そっと閉じてください';
      toBottom();
    });
  });
}
</script>
