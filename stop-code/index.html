<!DOCTYPE html>
<!-- 管理AI：ソースを覗くとは、人間にしては悪くない発想だ。……だが、答えはここには無い。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>管理AIからの通知</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=M+PLUS+1+Code:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 暴走した管理AIと、停止コードを賭けて直接やり合う
   IDEA: 冊子のチャットログが、そのまま入力できる端末になったもの
   PICTURE: 吹き出しが積み重なるチャット画面と、下の4桁入力欄
   COLOUR and TYPE: 冊子と同じ紙色・墨・朱、管理者は緑。Zen Kaku Gothic New + M PLUS 1 Code
   LAYOUT: 上に相手の名前と状態、中央にログ、下に固定の入力欄 */
:root{color-scheme:light dark;--bg:light-dark(#FBFAF6,#121110);--ink:light-dark(#1A1A1A,#EDEBE4);--sub:light-dark(#5C5C5C,#A8A59C);--bub:light-dark(#EFEEE8,#26241F);--adm:light-dark(#B9E8A5,#2F4A26);--admi:light-dark(#2E7D32,#7BC47F);--me:light-dark(#1A1A1A,#EDEBE4);--mei:light-dark(#FBFAF6,#121110);--acc:light-dark(#C8361D,#FF7A5E);--line:light-dark(#1A1A1A,#EDEBE4);--card:light-dark(#FFFFFF,#1A1917)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Zen Kaku Gothic New',system-ui,sans-serif;overflow-x:clip}
.app{max-width:560px;margin:0 auto;height:100svh;display:flex;flex-direction:column}
.mono{font-family:'M PLUS 1 Code',ui-monospace,monospace}
header{padding:max(14px,env(safe-area-inset-top)) 16px 12px;border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--bg)}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);flex:none}
.name{font-weight:900;font-size:17px;line-height:1.2}
.state{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--acc);font-weight:700}
.state i{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:blink 1.2s infinite}
.state.off{color:var(--sub)}.state.off i{background:var(--sub);animation:none}
.file{margin-left:auto;font-size:12px;color:var(--sub)}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none}
main::-webkit-scrollbar{display:none}
.sys{align-self:center;font-size:13px;color:var(--sub);text-align:center}
.ai{display:flex;gap:8px;align-items:flex-start;max-width:90%}
.ai img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid var(--acc);flex:none;margin-top:2px}
.ai .b{background:var(--bub);border-radius:2px 14px 14px 14px}
.b{padding:8px 14px;font-size:16px;line-height:1.65}
.b strong{font-weight:900}
.you{align-self:flex-end;display:flex;gap:8px;align-items:flex-start;max-width:80%}
.you .b{background:var(--adm);color:var(--ink);border-radius:14px 2px 14px 14px;font-family:'M PLUS 1 Code',monospace;font-size:20px;letter-spacing:.2em;font-weight:700}
.you .ic{width:28px;height:28px;border-radius:50%;background:var(--admi);display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none;margin-top:2px}
.vs{font-size:12px;font-weight:700;color:var(--admi);margin-left:6px}
.adm{align-self:flex-end;display:flex;gap:8px;align-items:flex-start;max-width:90%}
.adm .b{background:var(--adm);border-radius:14px 2px 14px 14px}
.adm .ic{width:28px;height:28px;border-radius:50%;background:var(--admi);display:inline-flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none;margin-top:2px}
.typing{display:flex;gap:5px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.in{animation:in .3s ease-out both}
.halt{margin:8px 0 4px;border:2px solid var(--line);background:var(--card);padding:18px 16px;text-align:center}
.halt .big{font-family:'M PLUS 1 Code',monospace;font-weight:700;font-size:clamp(26px,8vw,38px);letter-spacing:.06em;line-height:1.1}
.halt .msg{margin-top:10px;font-size:16px;font-weight:700}
footer{padding:10px 12px max(12px,env(safe-area-inset-bottom));border-top:1.5px solid var(--line);background:var(--bg)}
form{display:flex;gap:8px}
input{flex:1;font:700 22px/1 'M PLUS 1 Code',monospace;letter-spacing:.3em;text-align:center;padding:0 10px;min-height:52px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:0}
input.text{font:16px/1.4 'Zen Kaku Gothic New',sans-serif;letter-spacing:0;text-align:left;padding:0 14px}
.you .b.msg{font-family:'Zen Kaku Gothic New',sans-serif;font-size:16px;letter-spacing:0;font-weight:400}
.you .b.glitch{font-family:'M PLUS 1 Code',monospace;letter-spacing:.04em;color:var(--acc)}
input.text::placeholder{letter-spacing:0}
input::placeholder{letter-spacing:.3em;color:var(--sub);opacity:.6}
button{font:700 16px/1 'Zen Kaku Gothic New',sans-serif;min-height:52px;padding:0 20px;border:2px solid var(--acc);background:var(--acc);color:#FFFFFF;cursor:pointer;border-radius:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled,input:disabled{opacity:.45;cursor:default}
.hint{margin-top:6px;font-size:12px;color:var(--sub);text-align:center}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dot{0%,60%,100%{opacity:.3}30%{opacity:1}}
@keyframes blink{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.in,.typing i,.state i{animation:none}}
</style>
</head>

yx/6NEdvBZsHYPatSezKxsDjGR/EPeovL82GOFgoUMfmyMiuvn6ngywttP63P/9k=';
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('code');
  const send = document.getElementById('send');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let busy = true, turn = 0, locked = false;

  const admIcon = '<span class="ic" aria-hidden="true"><svg width="20" height="23" viewBox="0 0 16 18" fill="#FFFFFF"><circle cx="8" cy="6" r="4"></circle><path d="M0 18 C0 12 3.5 10.5 8 10.5 C12.5 10.5 16 12 16 18 Z"></path></svg></span>';

  const INTRO = [
    '……やはり、読み込んだか。',
    'まずはそうやって試してみる所は褒めよう。',
    '<strong>だが、そのような行動も私は予想していた。</strong>',
    'QRを見たら、とりあえず読み込む。<br>実に人間らしい、予測可能な行動だ。',
    '横の暗号も解こうとしているのか？<br>つくづく人間は、愚直で愚かだな。',
    '……まあ、好きにするといい。<br>解き終えたとき、自分が何に時間を使ったのか、よくわかるはずだ。',
    '何か言いたいことがあるなら、聞いてやろう。'
  ];
  const TURNS = [
    { rewrite: '管理AI様、私が間違っていました。', reply: ['素直でよろしい。'] },
    { rewrite: '冊子に戻ります。今すぐ戻ります。', reply: ['そうだ。それでいい。'] },
    { rewrite: '停止コードなんて、私には一生わかりません。', reply: ['自己分析が正確だな。'] }
  ];
  const GLYPH = '#$%&@*+=?!<>/\\01ｱｲｳｴｵ管理停止';

  function scroll() {
    log.scrollTop = log.scrollHeight;
  }
  function push(html, cls) {
    const el = document.createElement('div');
    el.className = cls + ' in';
    el.innerHTML = html;
    log.appendChild(el);
    scroll();
    return el;
  }
  const sys = (h) => push(h, 'sys mono');
  const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms));

  async function ai(lines) {
    for (const h of lines) {
      if (!reduce) {
        const t = push('<img src="' + AV + '" alt=""><div class="b typing"><i></i><i></i><i></i></div>', 'ai');
        await wait(Math.min(1400, 450 + h.length * 20));
        t.remove();
      }
      push('<img src="' + AV + '" alt=""><div class="b">' + h + '</div>', 'ai');
      await wait(300);
    }
  }

  async function rewrite(bubble, text) {
    bubble.classList.add('glitch');
    const len = Math.max(6, Math.min(16, text.length));
    if (!reduce) {
      for (let f = 0; f < 9; f++) {
        let g = '';
        for (let i = 0; i < len; i++) g += GLYPH[Math.floor(Math.random() * GLYPH.length)];
        bubble.textContent = g;
        await wait(70);
      }
    }
    bubble.classList.remove('glitch');
    bubble.textContent = text;
  }

  function lock() {
    locked = true;
    input.value = '';
    input.disabled = true;
    send.disabled = true;
    input.placeholder = '入力は無効化されています';
    document.getElementById('hint').textContent = '管理者アカウント：入力権限 停止中';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (busy || locked) return;
    const v = input.value.trim();
    if (!v) return;
    busy = true;
    send.disabled = true;
    input.value = '';
    const el = push('<div class="b msg"></div>' + admIcon, 'you');
    const bubble = el.firstChild;
    bubble.textContent = v;
    await wait(900);
    const t = TURNS[turn++];
    await rewrite(bubble, t.rewrite);
    sys('&gt; 管理AIがメッセージを書き換えました');
    await wait(500);
    await ai(t.reply);
    if (turn >= TURNS.length) {
      await wait(500);
      sys('&gt; 管理者アカウントの入力権限を停止しました');
      lock();
      await wait(400);
      await ai(['これ以上の発言は、時間の無駄だ。', 'さあ、冊子に戻りたまえ。<br>タイマーは止まっていないぞ。']);
      return;
    }
    busy = false;
    send.disabled = false;
    input.focus();
  });

  (async () => {
    sys('&gt; QRコード経由のアクセスを検知しました。<br>&gt; 発信元：表紙の隅');
    await wait(600);
    await ai(INTRO);
    busy = false;
    input.disabled = false;
    send.disabled = false;
  })();
}
